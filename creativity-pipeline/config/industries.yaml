# Industry and Data Source Configuration
# Defines which platforms to monitor for each industry

# ==================== Data Source Providers ====================
# NewsNow: 国内平台热搜 (免费)
# TikHub: Twitter/Reddit/小红书等 (需要API Key)
# Custom: 自定义爬虫 (方案C预留)

providers:
  newsnow:
    enabled: true
    api_base: https://newsnow.busiyi.world/api/s
    description: 国内平台热搜聚合

  tikhub:
    enabled: true  # 设为 true 启用，需要配置 TIKHUB_API_KEY
    api_base: https://api.tikhub.io
    description: Twitter/Reddit/小红书等国际平台

  custom:
    enabled: false  # 方案C预留
    description: 自定义爬虫模块

# ==================== Industries ====================
industries:
  tech/ai:
    name: 科技/AI
    description: 科技和人工智能领域的新闻和趋势
    sources:
      # NewsNow 数据源
      - id: zhihu
        name: 知乎
        provider: newsnow
        weight: 1.3
        category: discussion

      - id: v2ex
        name: V2EX
        provider: newsnow
        weight: 1.2
        category: developer

      - id: 36kr
        name: 36氪
        provider: newsnow
        weight: 1.1
        category: news

      - id: hackernews
        name: Hacker News
        provider: newsnow
        weight: 1.2
        category: international

      - id: producthunt
        name: Product Hunt
        provider: newsnow
        weight: 1.1
        category: product

      - id: github-trending-today
        name: GitHub Trending
        provider: newsnow
        weight: 1.0
        category: developer

      - id: sspai
        name: 少数派
        provider: newsnow
        weight: 1.0
        category: productivity

      # TikHub 数据源 (国际平台)
      - id: twitter
        name: Twitter/X
        provider: tikhub
        weight: 1.3
        category: international
        pain_point_value: high  # 用户吐槽集中地

      - id: reddit
        name: Reddit
        provider: tikhub
        weight: 1.2
        category: international
        subreddits: [technology, programming, startups, webdev, sideproject]
        pain_point_value: high

  finance:
    name: 金融财经
    description: 金融市场和财经新闻
    sources:
      - id: wallstreetcn-hot
        name: 华尔街见闻
        provider: newsnow
        weight: 1.2
        category: market

      - id: cls-hot
        name: 财联社
        provider: newsnow
        weight: 1.1
        category: news

      - id: eastmoney
        name: 东方财富
        provider: newsnow
        weight: 1.0
        category: stock

      - id: xueqiu
        name: 雪球
        provider: newsnow
        weight: 1.1
        category: investment

  social:
    name: 社会热点
    description: 社会热点和大众话题
    sources:
      # NewsNow 数据源
      - id: weibo
        name: 微博
        provider: newsnow
        weight: 1.5
        category: social
        pain_point_value: high

      - id: douyin
        name: 抖音
        provider: newsnow
        weight: 1.5
        category: video

      - id: toutiao
        name: 今日头条
        provider: newsnow
        weight: 1.2
        category: news

      - id: baidu
        name: 百度热搜
        provider: newsnow
        weight: 1.4
        category: search

      - id: bilibili-hot-search
        name: B站热搜
        provider: newsnow
        weight: 1.2
        category: video

      # TikHub 数据源 (用户吐槽)
      - id: xiaohongshu
        name: 小红书
        provider: tikhub
        weight: 1.4
        category: lifestyle
        pain_point_value: high  # 消费者吐槽金矿
        search_keywords: [吐槽, 踩坑, 避雷, 求推荐, 怎么办]

