    description: 效率工具和方法

  market:
    name: 市场
    description: 金融市场资讯

  stock:
    name: 股票
    description: 股票和证券

  investment:
    name: 投资
    description: 投资社区

  social:
    name: 社交
    description: 社交媒体

  video:
